# The words of every quest: titles, stories and steps. Numbers (energy, pay, tickets) live in rules.toml, and
# sponsored quests take theirs from the campaign.
#
# A step's `kind` says how it gets done:
#   talk, visit, paper, strongbox  the client reports it with QuestStep
#   cargo                          the client reports it; the server advances the cargo money if the wallet is short
#   swap, deliver, sign            a real transaction, sent with Swap, Deliver or PaintSign and seen on chain
#   verify                         the Town Pass (World ID)
#   hold                           holding the quest token, checked on chain at random moments
#   meals                          paid meals eaten after taking the quest
# `place` is where the client puts the quest marker: one of the town's places, or a person.

# ---------------------------------------------------------------- sponsored templates

[templates.spice_run]
title = "The Spice Run"
story = "Uniswap is paying for a spice run. The harbourmaster has cargo money for the spice market and nobody to carry it: swap it for MANGO through Uniswap at the exchange kiosk, then take it to the Spice Merchant. He pays back the cargo and a fee for your trouble."
steps = [
  { id = "cargo", kind = "cargo", place = "harbourmaster", text = "Collect the cargo money from the harbourmaster. If your wallet is short, he'll advance it." },
  { id = "swap", kind = "swap", place = "kiosk", text = "Swap the cargo money for MANGO through Uniswap at the exchange kiosk. Read the quote, the fee and the slippage first." },
  { id = "deliver", kind = "deliver", place = "spice-merchant", text = "Deliver the spice to the Spice Merchant at spice-merchant.tallyport.eth." },
]

[templates.paint_sign]
title = "Paint Your Shop Sign"
story = "Every stall on the waterfront has a sign, and yours is blank. The sign painter says a sign written on your own name is one nobody can paint over."
steps = [
  { id = "painter", kind = "talk", place = "painter", text = "Ask the sign painter what a name is for." },
  { id = "sign", kind = "sign", place = "stall", text = "Write your shop sign on your name. It's saved as your name's description." },
]

[templates.town_pass]
title = "The Town Pass"
story = "The town hall gives every person one pass, and only one. With it, the town can pay you."
steps = [
  { id = "clerk", kind = "talk", place = "hall", text = "Ask the clerk at the town hall about the pass." },
  { id = "verify", kind = "verify", place = "hall", text = "Show you're one real person with World ID." },
]

[templates.hold_line]
title = "Hold the Line"
story = "Prices jump about. The old traders say the hard part isn't buying, it's not selling in a panic. Hold the sponsor's token for three days."
steps = [
  { id = "trader", kind = "talk", place = "market", text = "Hear the old trader out." },
  { id = "hold", kind = "hold", place = "market", text = "Keep at least one token in your wallet for three days. The market checks at random." },
]

