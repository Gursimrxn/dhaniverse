# ---------------------------------------------------------------- Grandma's Ledger: once a season

[grandma]
title = "Grandma's Ledger"
story = "Your grandmother kept a ledger of everything Dhaniverse taught her about money. Three of its pages are scattered around Mumbai's old market, and the last opens her strongbox."
any_order = true
steps = [
  { id = "paper", kind = "paper", place = "square", text = "Page one: read the paper at the square on a day something big happens in the market." },
  { id = "clerk", kind = "talk", place = "bank", text = "Page two: ask the bank clerk about Grandma's records." },
  { id = "meals", kind = "meals", place = "table", text = "Page three: eat three meals you pay for yourself." },
  { id = "strongbox", kind = "strongbox", place = "homes", text = "Open Grandma's strongbox." },
]
