[package]
name = "chain"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Tallyport's link to Ethereum: wallets, EIP-712 vouchers, the transaction executor, the indexer, World ID"

[features]
# Runs tests/anvil.rs, which needs anvil and forge on PATH (see the test's header).
anvil-tests = []

[dependencies]
alloy = { version = "=2.5.0", default-features = false, features = [
  "std",
  "consensus",
  "dyn-abi",
  "eip712",
  "getrandom",
  "json-abi",
  "network",
  "provider-http",
  "reqwest",
  "reqwest-native-tls",
  "rpc-types",
  "signer-local",
  "signer-mnemonic",
  "sol-types",
] }
rules.workspace = true
serde.workspace = true
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "time", "sync", "macros", "net"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
