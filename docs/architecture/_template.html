<!doctype html>
<html lang="en">

<!-- Generated by build_docs.py from spec.json. Edit spec.json, then run: python3 build_docs.py -->
<style>
html,body{margin:0;background:var(--background,#fcfcfb)}
body.standalone{padding:16px 20px 40px}
@media (prefers-color-scheme:dark){html,body{background:var(--background,#1a1a19)}}
.ax{--ink:var(--foreground,#0b0b0b);--ink2:var(--muted-foreground,#55534e);--line:var(--border,#dcdad4);--bg:var(--background,#fcfcfb);
  --hot:#eb6834;--game:#2a78d6;--srv:#eb6834;--chain:#1baf7a;--ok:#1baf7a;--warn:#eda100;--bad:#d9453b;--r:var(--radius,12px);
  --mono:var(--font-mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace);
  font-family:var(--font-sans,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif);color:var(--ink);font-size:14px;line-height:1.45;max-width:980px;margin:0 auto}
@media (prefers-color-scheme:dark){.ax{--ink:var(--foreground,#f0efec);--ink2:var(--muted-foreground,#c3c2b7);--line:var(--border,#3a3a37);--bg:var(--background,#1a1a19)}}
.ax *{box-sizing:border-box}
.ax h2{font-size:16px;margin:20px 0 8px;font-weight:720}
.ax h3{font-size:17px;margin:0;font-weight:750}
.ax h4{font-size:13px;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}
.ax code{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--ink2);font-weight:400}
.small{font-size:12px}
.hero{padding:2px 0 2px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--hot)}
.hero h1{font-size:27px;line-height:1.15;margin:4px 0 6px;font-weight:760}
.hero p{margin:0;color:var(--ink2);font-size:14.5px;max-width:680px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 12px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:3}
.tab{font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.tab:hover{background:color-mix(in oklab,var(--ink) 7%,transparent)}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab:focus-visible,.chip:focus-visible,.pill:focus-visible,.btn:focus-visible,.fusebtn:focus-visible,.mini:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.panels{min-height:900px}
.panel{display:none}
.panel.on{display:block}
.panel.anim{animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.lede{color:var(--ink2);margin:0 0 10px}
.hint{font-size:12.5px;color:var(--ink2);margin:0 0 10px}
.box{border-radius:var(--r);padding:12px 14px;background:color-mix(in oklab,var(--hot) 10%,transparent);font-size:14px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;background:color-mix(in oklab,var(--ink) 2.5%,transparent)}
.card .em{font-size:24px;line-height:1;margin-bottom:6px}
.card b{display:block;font-size:14px;margin-bottom:3px}
.card p{margin:0;font-size:13px}
.grid5{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:620px){.grid5{grid-template-columns:repeat(6,1fr)}.grid5 .card:nth-child(-n+3){grid-column:span 2}.grid5 .card:nth-child(n+4){grid-column:span 3}}
.grid4{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.wait{display:block;margin-top:6px;font-size:12px;color:var(--ink2)}
.loop{list-style:none;margin:0;padding:0;display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(125px,1fr))}
.loop li{border:1px solid var(--line);border-radius:var(--r);padding:10px 11px;position:relative}
.loop .n,.fix .n,.dq .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--hot);color:#fff;font-size:12px;font-weight:750;margin-right:6px;flex:none}
.loop b{font-size:14px}
.loop small{display:block;color:var(--ink2);font-size:12px;margin-top:4px;line-height:1.35}
.two{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:620px){.two{grid-template-columns:1fr 1fr}}
.need{margin:0;padding-left:18px}
.need li{margin:4px 0}
.nums{border-collapse:collapse;width:100%;font-size:12.5px}
.nums th{text-align:left;font-weight:650;padding:5px 8px 5px 0;vertical-align:top;white-space:nowrap}
.nums td{padding:5px 0;border-top:1px solid var(--line);vertical-align:top}
.nums th{border-top:1px solid var(--line)}
.nums .ph{color:var(--ink2);white-space:nowrap;padding-left:8px;font-size:11.5px}

.bld{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.floor{display:grid;grid-template-columns:1fr;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}

.floor:first-child{border-top:0}
.floor:nth-child(even){background:color-mix(in oklab,var(--ink) 2.5%,transparent)}
.f-roof{background:repeating-linear-gradient(135deg,color-mix(in oklab,var(--srv) 7%,transparent) 0 8px,transparent 8px 16px)!important}
.f-ground{border-bottom:4px solid color-mix(in oklab,var(--ink) 30%,transparent)}
.flabel .fn{display:block;font-size:11px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--hot)}
.flabel b{display:block;font-size:14px}
.flabel small{display:block;color:var(--ink2);font-size:12px;line-height:1.3}
.flabel .fmeta{margin-top:2px;font-size:11.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.chip{font:inherit;text-align:left;cursor:pointer;border:1.5px solid color-mix(in oklab,var(--ink) 28%,transparent);background:var(--bg);color:var(--ink);border-radius:10px;padding:6px 9px;font-size:13px;font-weight:650;line-height:1.2}
.chip small{display:block;font-weight:400;color:var(--ink2);font-size:11.5px}
.chip:hover{border-color:var(--hot)}
.chip.sel{border-color:var(--hot);background:color-mix(in oklab,var(--hot) 13%,var(--bg))}
.chip.ext{border-style:dashed}
.chip.library{border-style:dotted}
.chip.roofchip{border-style:dashed;border-color:color-mix(in oklab,var(--srv) 55%,transparent)}
.foundation{padding:8px 12px;font-size:12px;color:var(--ink2);background:color-mix(in oklab,var(--chain) 10%,transparent);border-top:1px solid var(--line)}
.detail{margin-top:14px;border:1.5px solid color-mix(in oklab,var(--hot) 55%,transparent);border-radius:var(--r);padding:14px;scroll-margin-top:56px}
.dh{display:flex;gap:12px;align-items:flex-start}
.dem{font-size:34px;line-height:1}
.dh h3 i{font-style:normal;color:var(--ink2);font-weight:500;font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.tag.mb{border-color:color-mix(in oklab,var(--hot) 60%,transparent);color:var(--ink);background:color-mix(in oklab,var(--hot) 12%,transparent)}
.one{font-size:15px;margin:12px 0 6px}
.game{margin:0;font-size:13px;color:var(--ink2)}
.detail ul{margin:0;padding-left:18px;font-size:13px}
.detail li{margin:3px 0}
.talk{display:flex;flex-wrap:wrap;gap:5px}
.mini{font:inherit;font-size:12px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:3px 7px;cursor:pointer}
.mini:hover{border-color:var(--hot)}
.mini.off{cursor:default;color:var(--ink2)}
.file{font-size:12px;color:var(--ink2);margin:8px 0 0}
.fns{display:flex;flex-direction:column;gap:6px}
.fnr{border:1px solid var(--line);border-left:4px solid var(--hot);border-radius:10px;padding:7px 10px}
.fnr.r{border-left-color:color-mix(in oklab,var(--ink) 25%,transparent)}
.fsig{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}

.rw{font-size:10px;font-weight:750;text-transform:uppercase;letter-spacing:.06em;border-radius:5px;padding:0 5px;background:color-mix(in oklab,var(--hot) 16%,transparent);color:var(--ink)}

.pill small{color:var(--ink2);font-size:11.5px;margin-left:3px}
.pill[aria-pressed=true]{background:color-mix(in oklab,var(--hot) 14%,transparent);border-color:var(--hot)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px;font-size:12.5px}
.btn{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer}

.swim{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.srow{display:grid;grid-template-columns:70px 1fr 1fr 1fr;border-top:1px solid var(--line);transition:opacity .2s}
.srow:first-child{border-top:0}
.srow.head{background:color-mix(in oklab,var(--ink) 4%,transparent);font-size:12.5px}
.srow.head .lane{padding:7px 8px}
.srow.head small{display:block;color:var(--ink2);font-size:11px}
.srow.dim{opacity:.18}
.srow.cur{background:color-mix(in oklab,var(--hot) 9%,transparent)}
.st{font-size:11.5px;font-weight:700;color:var(--ink2);padding:8px 6px 8px 10px}
.lane{padding:6px;border-left:1px solid var(--line)}
.l-game{--lc:var(--game)}.l-server{--lc:var(--srv)}.l-chain{--lc:var(--chain)}
.srow.head .lane b{color:var(--lc)}
.sbox{border-radius:9px;padding:7px 9px;font-size:12.5px;background:color-mix(in oklab,var(--lc) 12%,transparent);border:1px solid color-mix(in oklab,var(--lc) 40%,transparent)}
.sbox.par{border-style:dashed}
.sbox .ln{display:none;font-size:10.5px;font-weight:750;text-transform:uppercase;letter-spacing:.05em;color:var(--lc);margin-bottom:2px}

.grp{border-top:1px solid var(--line);padding:5px 10px;font-size:11.5px;font-weight:750;color:var(--chain);background:color-mix(in oklab,var(--chain) 8%,transparent)}

@media(max-width:560px){
  .srow{grid-template-columns:66px 1fr}
  .st{padding-left:8px;font-size:11px}

}
/* breaks */
.term{margin:0;border-radius:var(--r);padding:12px 14px;background:#121417;color:#e6e6e3;font-family:var(--mono);font-size:12.5px;line-height:1.55;overflow-x:auto;white-space:pre}
.term .c{color:#8c8f94}
.term .x{color:#ff7a59;font-weight:700}
.term .k{color:#7cc4ff}
.fusegrid{display:flex;flex-wrap:wrap;gap:6px}
.fusebtn{font:inherit;font-size:12.5px;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 11px 5px 6px;cursor:pointer}
.sw{width:26px;height:15px;border-radius:999px;background:var(--ok);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:13px;width:11px;height:11px;border-radius:50%;background:#fff;transition:left .15s}

.fo.stop{background:color-mix(in oklab,var(--bad) 11%,transparent)}

.fix{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}

.loopmini{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:12.5px;margin:0 0 12px}

.ph{display:grid;grid-template-columns:38px 1fr;gap:10px;margin:0 0 10px;position:relative}
.pn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--bg);border:3px solid var(--hot);position:relative;z-index:1}
.pc{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.ph-h{display:flex;flex-wrap:wrap;gap:5px 8px;align-items:center}
.ph-h b{font-size:15px;margin-right:2px}
.tag.size{border-style:dashed}
.builds{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.bchip{font-size:12px;border-radius:8px;padding:2px 8px;background:color-mix(in oklab,var(--ink) 6%,transparent)}
.see{font-size:13px;padding:8px 10px;border-radius:10px;background:color-mix(in oklab,var(--game) 10%,transparent)}
.done{font-size:13px;margin-top:8px}
.done ul{margin:3px 0 0;padding-left:18px}
.done li{margin:2px 0}
.done li::marker{content:"☐  "}
.stu,.par2{font-size:12.5px;margin-top:7px;color:var(--ink2)}
.par2{color:var(--ink);font-weight:600}
/* decisions */
.decs{display:grid;gap:10px;grid-template-columns:1fr}

.dec{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.dq{display:flex;align-items:center}
.dq b{font-size:14px}
.dp{margin:7px 0 5px;padding:6px 9px;border-radius:9px;background:color-mix(in oklab,var(--ok) 13%,transparent);font-size:13px;font-weight:650}
.dec p{margin:0 0 5px;font-size:12.5px}
.dec small{display:block;font-size:12px;color:var(--ink2)}
.stud{display:flex;flex-direction:column;gap:5px}
.srow2{display:grid;grid-template-columns:78px 1fr;gap:2px 10px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px}

.srow2 span:last-child{color:var(--ink2)}

.fit-check .fit{background:color-mix(in oklab,var(--warn) 22%,transparent)}

<body>
<div class="ax" id="ax">
  <header class="hero">
    <div class="kicker" id="kicker"></div>
    <h1>How Dhaniverse's contracts work</h1>
    <p>Every contract, every function in it, and the order we build them in. Nothing here is code yet. Tap around.</p>
  </header>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" data-p="start" aria-selected="true">Start here</button>
    <button class="tab" role="tab" data-p="building" aria-selected="false">Contracts</button>
    <button class="tab" role="tab" data-p="speed" aria-selected="false">Two speeds</button>
    <button class="tab" role="tab" data-p="breaks" aria-selected="false">When it breaks</button>
    <button class="tab" role="tab" data-p="phases" aria-selected="false">Phases</button>
    <button class="tab" role="tab" data-p="decide" aria-selected="false">Decisions &amp; Studio</button>
    <button class="tab" role="tab" data-p="rules" aria-selected="false">Rules &amp; words</button>
  </nav>
  <main class="panels">
    <section class="panel on" id="p-start" role="tabpanel"></section>
    <section class="panel" id="p-building" role="tabpanel"></section>
    <section class="panel" id="p-speed" role="tabpanel"></section>
    <section class="panel" id="p-breaks" role="tabpanel"></section>
    <section class="panel" id="p-phases" role="tabpanel"></section>
    <section class="panel" id="p-decide" role="tabpanel"></section>
    <section class="panel" id="p-rules" role="tabpanel"></section>
  </main>
</div>
<script type="application/json" id="spec">__SPEC_JSON__</script>
<script>
(function () {
  "use strict";
  const S = JSON.parse(document.getElementById("spec").textContent);
  const E = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const byId = Object.fromEntries(S.contracts.map((c) => [c.id, c]));
  const floorById = Object.fromEntries(S.floors.map((f) => [f.id, f]));
  const $ = (id) => document.getElementById(id);
  const floorLabel = (f) => (f.id === "roof" ? "Off-chain" : "Layer " + f.n);
  const KIND = { building: "Contract (ours)", wallet: "Wallet (one per citizen)", library: "Library: pure maths", token: "Token", hook: "Uniswap hook", base: "Shared base", external: "Not ours" };
  if (window.top === window) document.body.classList.add("standalone");

  const WORD = ["No", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten", "Eleven", "Twelve"];
  const word = (n) => WORD[n] || String(n);
  const countOf = (kind) => S.contracts.filter((c) => c.kind === kind).length;
  document.title = S.meta.title;
  $("kicker").textContent = "Contracts architecture · " + S.meta.version + " · " + S.meta.date;

  /* ---------- tabs ---------- */
  const tabs = Array.from(document.querySelectorAll(".tab"));
  function show(p) {
    tabs.forEach((t) => t.setAttribute("aria-selected", String(t.dataset.p === p)));
    document.querySelectorAll(".panel").forEach((x) => {
      const on = x.id === "p-" + p;
      x.classList.toggle("on", on);
      if (on) { x.classList.remove("anim"); void x.offsetWidth; x.classList.add("anim"); }
    });
  }
  tabs.forEach((t) => t.addEventListener("click", () => show(t.dataset.p)));

  /* ---------- start here ---------- */
  function renderStart() {
    const ours = S.contracts.filter((c) => c.ours && c.kind !== "library" && c.kind !== "base").length;
    const fns = S.contracts.reduce((n, c) => n + c.fns.length, 0);
    $("p-start").innerHTML =
      '<div class="box"><b>The 30-second version.</b> ' + E(S.summary) + "</div>" +
      '<p class="hint" style="margin-top:8px">' + ours + " contracts of ours" +
      (countOf("library") ? ", " + countOf("library") + " maths libraries" : "") +
      (countOf("base") ? ", " + countOf("base") + " shared base" : "") +
      " and " + S.contracts.filter((c) => !c.ours).length + " that aren't ours: " + fns + " functions in all, every one explained under <b>Contracts</b>.</p>" +
      "<h2>Five promises</h2>" +
      '<div class="grid5">' + S.promises.map((x) => '<div class="card"><div class="em">' + x.icon + "</div><b>" + E(x.title) + "</b><p>" + E(x.text) + "</p></div>").join("") + "</div>" +
      "<h2>How we work, every phase</h2>" +
      '<ol class="loop">' + S.workLoop.map((s) => '<li><span class="n">' + s.n + "</span><b>" + E(s.title) + "</b><small>" + E(s.text) + "</small></li>").join("") + "</ol>" +
      '<div class="two"><div><h2>What I need from you</h2><ol class="need">' + S.needFromYou.map((x) => "<li>" + E(x) + "</li>").join("") + "</ol></div>" +
      '<div><h2>Numbers the tests must hit</h2><table class="nums"><tbody>' +
      S.numbers.map((n) => "<tr><th>" + E(n.what) + "</th><td>" + E(n.value) + '</td><td class="ph">Phase ' + E(n.phase) + "</td></tr>").join("") +
      "</tbody></table></div></div>";
  }

  /* ---------- the building ---------- */
  function renderBuilding() {
    const rows = S.floors.map((f) => {
      let chips;
      if (f.id === "roof") {
        chips = S.offchain.map((o) => '<button class="chip roofchip" data-roof="1" title="' + E(o.does) + '">' + o.emoji + " " + E(o.name) + "</button>").join("");
      } else {
        chips = S.contracts.filter((c) => c.floor === f.id).map((c) =>
          '<button class="chip ' + (c.ours ? "" : "ext ") + E(c.kind) + '" data-c="' + E(c.id) + '"><span>' + c.emoji + "</span> " + E(c.id) + "<small>" + E(c.nick) + "</small></button>").join("");
      }
      return '<div class="floor f-' + E(f.id) + '"><div class="flabel"><span class="fn">' + floorLabel(f) + "</span><b>" + E(f.name) + "</b><small>" + E(f.plain) + '</small><small class="fmeta">Phase ' + E(f.phase) + " · " + E(f.chapter) + '</small></div><div class="chips">' + chips + "</div></div>";
    }).join("");
    $("p-building").innerHTML =
      '<p class="hint">Layers are built bottom to top, Layer 0 first. Tap a contract to see every function in it. Dashed = not ours.' + (countOf("library") ? " Dotted = a library (pure maths, stores nothing)." : "") + "</p>" +
      '<div class="bld">' + rows + '<div class="foundation">' + E(S.meta.foundation) + "</div></div>" +
      '<div id="detail" class="detail" aria-live="polite"></div>';
    $("p-building").querySelectorAll("[data-c]").forEach((b) => b.addEventListener("click", () => select(b.dataset.c, true)));
    $("p-building").querySelectorAll("[data-roof]").forEach((b) => b.addEventListener("click", () => showRoof(true)));
    select(S.meta.firstContract || S.contracts.find((c) => c.ours).id, false);
  }
  function fnRow(f) {
    return '<div class="fnr ' + (f.read ? "r" : "w") + '"><div class="fsig"><span class="rw">' + (f.read ? "read" : "write") + "</span><code>" + E(f.sig) + '</code></div><div class="fdo">' + E(f.does) + '</div><div class="fmeta"><span>👤 ' + E(f.who) + "</span><span>🕒 " + E(f.when) + "</span></div></div>";
  }
  function talkChip(t) {
    const id = t.split(" (")[0];
    return byId[id] ? '<button class="mini" data-c="' + E(id) + '">' + byId[id].emoji + " " + E(t) + "</button>" : '<span class="mini off">' + E(t) + "</span>";
  }
  function markSel(id) {
    document.querySelectorAll(".chip[data-c]").forEach((b) => b.classList.toggle("sel", b.dataset.c === id));
    document.querySelectorAll(".chip[data-roof]").forEach((b) => b.classList.toggle("sel", id === "__roof"));
  }
  function select(id, scroll) {
    const c = byId[id];
    if (!c) return;
    markSel(id);
    const f = floorById[c.floor];
    const d = $("detail");
    d.innerHTML =
      '<div class="dh"><span class="dem">' + c.emoji + "</span><div><h3>" + E(c.id) + " <i>" + E(c.nick) + '</i></h3><div class="tags">' +
      '<span class="tag">' + floorLabel(f) + " · " + E(f.name) + '</span><span class="tag">Phase ' + c.phase + '</span><span class="tag">' + E(KIND[c.kind] || c.kind) + "</span>" +
      '<span class="tag">Upgrade: ' + E(c.upgrade) + '</span><span class="tag">Off switch: ' + E(c.fuse) + "</span></div></div></div>" +
      '<p class="one">' + E(c.one) + "</p>" +
      '<p class="game">🎮 <b>In the game:</b> ' + E(c.game) + "</p>" +
      '<div class="two"><div><h4>What it stores</h4><ul>' + c.remembers.map((r) => "<li>" + E(r) + "</li>").join("") + "</ul></div>" +
      '<div><h4>What it calls or reads</h4><div class="talk">' + (c.talksTo.length ? c.talksTo.map(talkChip).join("") : '<span class="muted small">Nothing. Other contracts read it.</span>') + "</div>" +
      '<p class="file">📁 <code>' + E(c.file) + "</code></p></div></div>" +
      '<h4>Functions <span class="muted">(' + c.fns.length + ")</span></h4>" +
      '<div class="fns">' + c.fns.map(fnRow).join("") + "</div>" +
      '<div class="two"><div><h4>Events it emits</h4>' +
      (c.events.length ? '<ul class="ev">' + c.events.map((x) => "<li><code>" + E(x.sig) + "</code><span>" + E(x.means) + "</span></li>").join("") + "</ul>" : '<p class="muted small">None.</p>') +
      '</div><div><h4>Errors it can throw</h4>' +
      (c.errors.length ? '<ul class="er">' + c.errors.map((x) => "<li><code>" + E(x.sig) + "</code><span>" + E(x.means) + "</span></li>").join("") + "</ul>" : '<p class="muted small">None.</p>') +
      "</div></div>";
    d.querySelectorAll("[data-c]").forEach((b) => b.addEventListener("click", () => select(b.dataset.c, true)));
    if (scroll) d.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
  function showRoof(scroll) {
    markSel("__roof");
    const d = $("detail");
    d.innerHTML =
      '<div class="dh"><span class="dem">🖥️</span><div><h3>Off-chain <i>helpers</i></h3><div class="tags">' + S.meta.roofTags.map((t) => '<span class="tag">' + E(t) + "</span>").join("") + "</div></div></div>" +
      '<p class="one">' + E(S.meta.roofOne) + "</p>" +
      '<div class="fns">' + S.offchain.map((o) => '<div class="fnr r"><div class="fsig"><code>' + o.emoji + " " + E(o.name) + '</code></div><div class="fdo">' + E(o.does) + "</div></div>").join("") + "</div>";
    if (scroll) d.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  /* ---------- two speeds ---------- */
  let flowId = S.flows[0].id, stepMode = false, stepAt = 0;
  function renderSpeed() {
    $("p-speed").innerHTML =
      '<h2 style="margin-top:4px">' + word(S.moments.length) + " kinds of moment</h2>" +
      '<div class="grid4">' + S.moments.map((m) => '<div class="card"><div class="em">' + m.icon + "</div><b>" + E(m.title) + "</b><p>" + E(m.text) + '</p><small class="wait">⏱ ' + E(m.wait) + "</small></div>").join("") + "</div>" +
      "<h2>Step by step</h2>" +
      '<div class="pills" id="flowPills">' + S.flows.map((f) => '<button class="pill" data-f="' + E(f.id) + '">' + E(f.title) + " <small>" + E(f.tag) + "</small></button>").join("") + "</div>" +
      '<div id="flow"></div>';
    $("p-speed").querySelectorAll("[data-f]").forEach((b) => b.addEventListener("click", () => { flowId = b.dataset.f; stepMode = false; stepAt = 0; drawFlow(); }));
    drawFlow();
  }
  function drawFlow() {
    const f = S.flows.find((x) => x.id === flowId);
    document.querySelectorAll("#flowPills .pill").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.f === flowId)));
    const n = f.steps.length;
    let lastGroup = null;
    const rows = f.steps.map((s, i) => {
      const g = s.group && s.group !== lastGroup ? '<div class="grp' + (stepMode && i > stepAt ? " dim" : "") + '">' + E(s.group) + "</div>" : "";
      lastGroup = s.group || null;
      const cls = ["srow", stepMode && i > stepAt ? "dim" : "", stepMode && i === stepAt ? "cur" : "", s.group ? "ing" : ""].join(" ");
      const lanes = ["game", "server", "chain"].map((l) => {
        if (s.lane !== l) return '<div class="lane l-' + l + '"></div>';
        const label = { game: "🎮 Game", server: "🖥️ Server", chain: "⛓️ " + (s.on || "Arc") }[l];
        return '<div class="lane l-' + l + '"><div class="sbox' + (s.par ? " par" : "") + '"><span class="ln">' + label + "</span>" + (s.par ? '<span class="pb">‖ alongside</span>' : "") + E(s.text) + "</div></div>";
      }).join("");
      return g + '<div class="' + cls + '"><div class="st">' + E(s.t) + "</div>" + lanes + "</div>";
    }).join("");
    $("flow").innerHTML =
      '<p class="lede">' + E(f.lede) + "</p>" +
      '<div class="ctl"><button class="btn" id="bStep">' + (stepMode ? "Restart" : "Step through") + "</button>" +
      '<button class="btn" id="bPrev"' + (!stepMode || stepAt === 0 ? " disabled" : "") + ">◀ Back</button>" +
      '<button class="btn" id="bNext"' + (!stepMode || stepAt >= n - 1 ? " disabled" : "") + ">Next ▶</button>" +
      '<button class="btn" id="bAll"' + (stepMode ? "" : " disabled") + ">Show all</button>" +
      '<span class="muted">' + (stepMode ? "Step " + (stepAt + 1) + " of " + n : n + " steps") + "</span></div>" +
      '<div class="swim"><div class="srow head"><div class="st"></div>' +
      '<div class="lane l-game"><b>🎮 Game</b><small>Godot in the browser: what the player sees</small></div>' +
      '<div class="lane l-server"><b>🖥️ Server</b><small>Rust, your teammate\'s</small></div>' +
      '<div class="lane l-chain"><b>' + E((S.meta.chainLane || ["⛓️ Arc"])[0]) + "</b><small>" + E((S.meta.chainLane || ["", "our contracts"])[1]) + "</small></div></div>" + rows + "</div>" +
      '<p class="foot">' + E(f.foot) + "</p>";
    $("bStep").addEventListener("click", () => { stepMode = true; stepAt = 0; drawFlow(); });
    $("bPrev").addEventListener("click", () => { if (stepAt > 0) { stepAt--; drawFlow(); } });
    $("bNext").addEventListener("click", () => { if (stepAt < n - 1) { stepAt++; drawFlow(); } });
    $("bAll").addEventListener("click", () => { stepMode = false; drawFlow(); });
  }

  /* ---------- when it breaks ---------- */
  function termLine(line, i) {
    if (i === 0) return '<span class="c">' + E(line) + "</span>";
    if (line.startsWith("✗")) return '<span class="x">' + E(line) + "</span>";
    const m = line.match(/^(\s+)(Meaning|Where|Tx|Next|Unwrapped)(\s.*)$/);
    if (m) return E(m[1]) + '<span class="k">' + E(m[2]) + "</span>" + E(m[3]);
    return E(line);
  }
  function renderBreaks() {
    $("p-breaks").innerHTML =
      '<h2 style="margin-top:4px">1 · Find it in seconds</h2>' +
      '<p class="lede">Any error from any contract, turned into plain words with the exact place in the code.</p>' +
      '<div class="pills" id="errPills">' + S.errorDemos.map((d, i) => '<button class="pill" data-e="' + i + '">' + E(d.label) + "</button>").join("") + "</div>" +
      '<pre class="term" id="term"></pre>' +
      '<p class="muted small">Example output. The line numbers are placeholders until the code exists.</p>' +
      "<h2>2 · Switch one piece off, and the rest keep working</h2>" +
      '<p class="lede">Pick a switch. Reads still work, and anything that doesn\'t need that piece carries on.</p>' +
      '<div class="fusegrid">' + S.fuses.map((f, i) => '<button class="fusebtn" data-fz="' + i + '"><span class="sw"></span>' + byId[f.id].emoji + " " + E(f.id) + (f.label ? ": " + E(f.label) : "") + "</button>").join("") + "</div>" +
      '<div class="fuseout" id="fuseout"></div>' +
      '<p class="muted small">' + E(S.meta.fuseNote || "") + "</p>" +
      "<h2>3 · Fix it without breaking anything</h2>" +
      '<ol class="fix">' + S.fixSteps.map((s, i) => '<li><span class="n">' + (i + 1) + "</span><div><b>" + E(s.t) + "</b><small>" + E(s.d) + "</small></div></li>").join("") + "</ol>";
    $("p-breaks").querySelectorAll("[data-e]").forEach((b) => b.addEventListener("click", () => pickErr(Number(b.dataset.e))));
    $("p-breaks").querySelectorAll("[data-fz]").forEach((b) => b.addEventListener("click", () => pickFuse(Number(b.dataset.fz))));
    pickErr(0);
    pickFuse(0);
  }
  function pickErr(i) {
    document.querySelectorAll("#errPills .pill").forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.e) === i)));
    $("term").innerHTML = S.errorDemos[i].lines.map(termLine).join("\n");
  }
  function pickFuse(i) {
    const f = S.fuses[i];
    if (!f) return;
    document.querySelectorAll(".fusebtn").forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.fz) === i)));
    $("fuseout").innerHTML =
      '<div class="fo stop"><b>🔴 ' + E(f.id) + (f.label ? ": " + E(f.label) : " off") + ". What stops</b><ul>" + f.stops.map((x) => "<li>" + E(x) + "</li>").join("") + "</ul></div>" +
      '<div class="fo keep"><b>🟢 What keeps working</b><ul>' + f.keeps.map((x) => "<li>" + E(x) + "</li>").join("") + "</ul></div>";
  }

  /* ---------- phases ---------- */
  function renderPhases() {
    $("p-phases").innerHTML =
      '<p class="hint">' + E(S.meta.phasesHint || "") + " Bottom to top: each phase builds on the one before it. Sizes are relative (S, M, L). Every phase runs the same loop:</p>" +
      '<div class="loopmini">' + S.workLoop.map((s) => "<span>" + s.n + ". " + E(s.title) + "</span>").join("<i>→</i>") + "</div>" +
      (S.prep ? '<div class="box" style="margin:10px 0"><b>Before the first phase</b><ul style="margin:6px 0 0;padding-left:18px">' + S.prep.map((x) => "<li>" + E(x) + "</li>").join("") + "</ul></div>" : "") +
      '<ol class="ladder">' + S.phases.map((p) => {
        const f = floorById[p.floor];
        return '<li class="ph"><div class="pn">' + p.n + '</div><div class="pc"><div class="ph-h"><b>' + E(p.name) + '</b><span class="tag">' + floorLabel(f) + "</span>" +
          (p.chapter ? '<span class="tag mb">' + E(p.chapter) + "</span>" : "") + '<span class="tag size">Size ' + E(p.size) + "</span></div>" +
          '<div class="builds">' + p.builds.map((b) => '<span class="bchip">' + E(b) + "</span>").join("") + "</div>" +
          '<div class="see"><b>You\'ll see:</b> ' + E(p.see) + "</div>" +
          '<div class="done"><b>Done when</b><ul>' + p.done.map((d) => "<li>" + E(d) + "</li>").join("") + "</ul></div>" +
          (p.studio ? '<div class="stu">🛠️ <b>Arc Studio:</b> ' + E(p.studio) + "</div>" : "") +
          (p.parallel ? '<div class="par2">‖ ' + E(p.parallel) + "</div>" : "") +
          "</div></li>";
      }).join("") + "</ol>";
  }

  /* ---------- decisions and studio ---------- */
  function fitInfo(fit) {
    if (fit === "easy") return ["easy", "✓ Easy"];
    if (fit === "no") return ["no", "✗ No"];
    return ["check", "? Check"];
  }
  function renderDecide() {
    $("p-decide").innerHTML =
      '<h2 style="margin-top:4px">' + word(S.decisions.length) + " decisions I\'ve made for you</h2>" +
      '<p class="lede">Each one is my pick. Say no to any of them and I\'ll change the map.</p>' +
      '<div class="decs">' + S.decisions.map((d, i) =>
        '<div class="dec"><div class="dq"><span class="n">' + (i + 1) + "</span><b>" + E(d.q) + '</b></div><div class="dp">✓ ' + E(d.pick) + "</div><p>" + E(d.why) + "</p><small><b>Instead:</b> " + E(d.alt) + "</small></div>").join("") + "</div>" +
      (S.notOnChain ? "<h2>Considered, and kept off-chain</h2>" + '<div class="stud">' + S.notOnChain.map((x) => '<div class="srow2 fit-no"><span class="fit">Off-chain</span><b>' + E(x.what) + "</b><span>" + E(x.why) + "</span></div>").join("") + "</div>" : "") +
      "<h2>Arc Studio: where it fits</h2>" +
      '<div class="stud">' + S.studio.map((s) => {
        const fi = fitInfo(s.fit);
        return '<div class="srow2 fit-' + fi[0] + '"><span class="fit">' + fi[1] + "</span><b>" + E(s.where) + "</b><span>" + E(s.how) + (fi[0] === "check" ? " (" + E(s.fit) + ")" : "") + "</span></div>";
      }).join("") + "</div>" +
      "<h2>" + E(S.meta.checked || "Checked") + "</h2>" +
      '<ul class="facts">' + S.facts.map((f) => "<li>" + E(f.fact) + (f.src ? ' <a href="' + E(f.src) + '" target="_blank" rel="noopener">source</a>' : "") + "</li>").join("") + "</ul>";
  }

  /* ---------- rules and words ---------- */
  function renderRules() {
    $("p-rules").innerHTML =
      '<h2 style="margin-top:4px">Rules of the code</h2>' +
      '<ol class="rules">' + S.rules.map((r) => "<li><b>" + E(r.t) + "</b><span>" + E(r.d) + "</span></li>").join("") + "</ol>" +
      "<h2>Words, in plain language</h2>" +
      '<div class="words">' + S.words.map((w) => '<div class="word"><b>' + E(w.w) + "</b>" + E(w.d) + (w.like ? "<small>Like " + E(/^[A-Z]{2}/.test(w.like) ? w.like : w.like.charAt(0).toLowerCase() + w.like.slice(1)) + "</small>" : "") + "</div>").join("") + "</div>";
  }

  renderStart();
  renderBuilding();
  renderSpeed();
  renderBreaks();
  renderPhases();
  renderDecide();
  renderRules();

  /* Deep links: #building/FoodHook, #speed/day, #breaks/2, #phases ... */
  const [tab, item] = decodeURIComponent(location.hash.slice(1)).split("/");
  if (tabs.some((t) => t.dataset.p === tab)) {
    tabs.forEach((t) => t.setAttribute("aria-selected", String(t.dataset.p === tab)));
    document.querySelectorAll(".panel").forEach((x) => x.classList.toggle("on", x.id === "p-" + tab));
    if (tab === "building" && item) { if (item === "roof") showRoof(false); else select(item, false); }
    if (tab === "speed" && item && S.flows.some((f) => f.id === item)) { flowId = item; drawFlow(); }
    if (tab === "breaks" && item && S.fuses[Number(item)]) pickFuse(Number(item));
  }
})();
</script>
</body>
</html>
